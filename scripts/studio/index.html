<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>渐鸿 · 写作台</title>
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('studio-theme'); } catch (e) {}
    var forced = new URLSearchParams(location.search).get('theme');
    if (forced === 'light' || forced === 'dark') saved = forced;
    var theme = saved === 'light' || saved === 'dark'
      ? saved
      : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand__dot"></span>
      <span class="brand__name">写作台</span>
      <span class="brand__sub">渐鸿</span>
    </div>

    <span class="dirty-flag" id="dirtyFlag">未保存</span>

    <div class="tabs" role="tablist">
      <button class="tab is-active" data-type="note" role="tab">说说</button>
      <button class="tab" data-type="post" role="tab">文章</button>
    </div>

    <div class="topbar__right">
      <span id="gitPill" class="pill" title="仓库状态">…</span>
      <button id="btnLibrary" class="btn btn--ghost" type="button" title="内容库（Ctrl+K）">内容库</button>
      <button id="btnNew" class="btn btn--ghost" type="button">新建</button>
      <button id="btnPreviewToggle" class="btn btn--ghost btn--sm btn--preview-toggle" type="button" title="显示 / 隐藏预览">预览</button>
      <button id="btnTheme" class="iconbtn" type="button" title="切换日间 / 夜间">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </div>
  </header>

  <main class="grid">

    <section class="pane pane--meta">
      <div class="pane__head">元信息</div>
      <div class="fields" id="fields">

        <div class="field" data-for="post">
          <label for="fTitle">标题</label>
          <input id="fTitle" type="text" placeholder="一句话说清这篇写什么" />
        </div>

        <div class="field" data-for="post">
          <label for="fDesc">描述</label>
          <input id="fDesc" type="text" placeholder="用于列表摘要与 SEO，最多 300 字" />
        </div>

        <div class="field" data-for="post">
          <label for="fSlug">网址 slug</label>
          <input id="fSlug" type="text" placeholder="english-words-here" />
          <p class="hint">决定文章地址 /blog/<span id="slugPreview">slug</span>/，建议英文</p>
        </div>

        <div class="field" data-for="note">
          <label for="fCategory">分类</label>
          <select id="fCategory"></select>
        </div>

        <div class="field" data-for="note">
          <label for="fLocation">地点</label>
          <input id="fLocation" type="text" placeholder="杭州 · 西湖（可留空）" />
        </div>

        <div class="field" data-for="note">
          <label for="fMood">心情</label>
          <div class="mood-row">
            <input id="fMood" type="text" maxlength="8" placeholder="一个 emoji（可留空）" />
            <div class="mood-quick" id="moodQuick"></div>
          </div>
        </div>

        <div class="field">
          <label for="fDate" id="dateLabel">时间</label>
          <input id="fDate" type="datetime-local" />
        </div>

        <div class="field">
          <label for="fTags">标签</label>
          <input id="fTags" type="text" placeholder="用逗号分隔，例如：日常, 读书" />
        </div>

        <div class="field">
          <label for="fAuthor">作者</label>
          <div class="author-row">
            <input id="fAuthor" type="text" placeholder="站长" />
            <span class="avatar-preview" id="avatarPreview" data-for="note" title="头像预览">站</span>
          </div>
        </div>

        <div class="field" data-for="note">
          <label>头像</label>
          <div class="author-row">
            <button id="btnAvatar" class="btn btn--ghost btn--sm" type="button">上传图片</button>
            <button id="btnAvatarClear" class="linkbtn" type="button">清除</button>
            <span class="hint hint--inline" id="avatarPath">未设置，用作者名首字</span>
          </div>
        </div>

        <div class="field" data-for="post">
          <label for="fCover">封面图</label>
          <input id="fCover" type="text" placeholder="/images/blog/xxx/cover.webp（可留空）" />
        </div>

        <div class="switches">
          <label class="switch" data-for="note"><input id="fPinned" type="checkbox" /><span>置顶</span></label>
          <label class="switch" data-for="post"><input id="fComments" type="checkbox" checked /><span>开启评论</span></label>
          <label class="switch"><input id="fDraft" type="checkbox" /><span>草稿</span></label>
        </div>

        <div class="field field--full">
          <label>配图 <span class="hint hint--inline" id="imgHint">自动转 webp · 长边压到 1600</span></label>
          <div class="thumbs" id="thumbs">
            <p class="thumbs__empty">还没有配图，拖到编辑区即可</p>
          </div>
        </div>

      </div>
    </section>

    <section class="pane pane--write">
      <div class="pane__head">
        <span>正文</span>
        <span class="pane__hint">Markdown</span>
      </div>

      <div class="toolbar" id="toolbar">
        <button type="button" data-md="h2" title="二级标题（## ）">H2</button>
        <button type="button" data-md="h3" title="三级标题（### ）">H3</button>
        <span class="tb-sep"></span>
        <button type="button" data-md="bold" class="tb-b" title="粗体（Ctrl+B）">B</button>
        <button type="button" data-md="italic" class="tb-i" title="斜体（Ctrl+I）">I</button>
        <span class="tb-sep"></span>
        <button type="button" data-md="quote" title="引用（&gt; ）">引用</button>
        <button type="button" data-md="code" class="tb-code" title="行内代码（` `）">代码</button>
        <button type="button" data-md="codeblock" class="tb-code" title="代码块（```）">代码块</button>
        <span class="tb-sep"></span>
        <button type="button" data-md="link" title="链接（Ctrl+K）">链接</button>
        <button type="button" data-md="ul" title="无序列表（- ）">列表</button>
        <button type="button" data-md="ol" title="有序列表（1. ）">1.</button>
        <span class="tb-sep"></span>
        <button type="button" data-md="hr" title="分割线">分割线</button>
        <button type="button" data-md="image" title="插入图片">图片</button>
      </div>

      <textarea id="body" spellcheck="false" placeholder="随便写点什么…"></textarea>

      <div class="dropzone" id="dropzone">
        <span>拖图片到这里，或 <button type="button" id="btnPick" class="linkbtn">选择文件</button>，也可以直接 Ctrl+V 粘贴</span>
        <span class="dropzone__hint" id="dropHint">说说：进九宫格</span>
      </div>
      <input id="filePicker" type="file" accept="image/*" multiple hidden />
      <input id="avatarPicker" type="file" accept="image/*" hidden />
    </section>

    <section class="pane pane--preview">
      <div class="pane__head">
        <span>预览</span>
        <span class="pane__hint" id="metaLine">—</span>
      </div>
      <div class="preview" id="preview">
        <article class="note-preview" id="notePreview">
          <header class="note-preview__head">
            <span class="avatar" id="pvAvatar">站</span>
            <div>
              <div class="note-preview__who">
                <span id="pvAuthor">站长</span>
                <span class="cat" id="pvCat">杂项</span>
              </div>
              <div class="note-preview__sub">
                <span id="pvTime">—</span>
                <span id="pvLoc"></span>
              </div>
            </div>
            <span class="mood" id="pvMood"></span>
          </header>
          <div class="note-preview__body" id="pvBody"></div>
          <div class="note-preview__grid" id="pvGrid" data-count="0"></div>
        </article>
        <article class="post-preview" id="postPreview" hidden>
          <h1 id="pvTitle">无标题</h1>
          <p class="post-preview__desc" id="pvDesc"></p>
          <div class="note-preview__body" id="pvPostBody"></div>
        </article>
      </div>
    </section>

  </main>

  <footer class="actionbar">
    <div class="status" id="status">准备就绪</div>
    <div class="live-stats" id="liveStats">—</div>
    <div class="actionbar__btns">
      <button id="btnSaveDraft" class="btn btn--ghost" type="button">存为草稿</button>
      <button id="btnSave" class="btn btn--solid" type="button">保存</button>
      <button id="btnPublish" class="btn btn--primary" type="button">保存并发布</button>
    </div>
  </footer>

</div>

<div class="overlay" id="overlay">
  <div class="library" role="dialog" aria-label="内容库">
    <div class="library__head">
      <input id="libSearch" class="library__search" type="text" placeholder="搜索标题、分类、日期、文件名…" />
      <div class="library__filters" id="libFilters">
        <button class="chip is-active" type="button" data-filter="all">全部</button>
        <button class="chip" type="button" data-filter="note">说说</button>
        <button class="chip" type="button" data-filter="post">文章</button>
        <button class="chip" type="button" data-filter="draft">草稿</button>
      </div>
    </div>
    <div class="library__list" id="libList"></div>
    <div class="library__foot">
      <span id="libCount">—</span>
      <span>删除会移入 .trash/，可手动恢复</span>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
